
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background: #f2f2f7;}
.phone{width:320px;margin:12px auto;background:var(--color-background-secondary);border-radius:var(--border-radius-xl);padding:20px;border:0.5px solid var(--color-border-tertiary);background: #fff;}
.screen{background:var(--color-background-primary);border-radius:16px;overflow:hidden;border:0.5px solid var(--color-border-tertiary);}

.login-view{padding:32px 20px 24px;}
.login-view.hidden{display:none;}
.create-view{padding:24px 20px;display:none;}
.create-view.active{display:block;}

.logo-area{text-align:center;margin-bottom:32px;}
.logo-icon{width:52px;height:52px;border-radius:14px;background:#7b72e9;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px;}
.logo-title{font-size:17px;font-weight:700;color:var(--color-text-primary);}
.logo-sub{font-size:12px;color:var(--color-text-secondary);margin-top:3px;}

.form-group{margin-bottom:14px;}
.form-label{font-size:11px;font-weight:500;color:var(--color-text-secondary);margin-bottom:5px;display:block;}
.form-input{width:100%;padding:10px 12px;border:1px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:13px;font-family:inherit;background:var(--color-background-primary);color:var(--color-text-primary);outline:none;transition:border-color .15s;}
.form-input:focus{border-color:#7b72e9;}
.form-input::placeholder{color:var(--color-text-tertiary);}

.pw-wrap{position:relative;}
.pw-wrap .form-input{padding-right:36px;}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--color-text-tertiary);padding:2px;font-size:16px;line-height:1;}

.btn-primary{width:100%;padding:11px;border:none;border-radius:var(--border-radius-md);background:#7b72e9;color:#fff;font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:4px;}
.btn-primary:active{opacity:.9;}

.divider{display:flex;align-items:center;gap:10px;margin:16px 0;}
.divider-line{flex:1;height:0.5px;background:var(--color-border-tertiary);}
.divider-text{font-size:11px;color:var(--color-text-tertiary);}

.profile-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
.profile-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;background:var(--color-background-primary);transition:border-color .15s;}
.profile-card:hover{border-color:#7b72e9;}
.profile-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.profile-info{flex:1;min-width:0;}
.profile-name{font-size:13px;font-weight:500;color:var(--color-text-primary);}
.profile-id{font-size:11px;color:var(--color-text-tertiary);margin-top:1px;}
.profile-arrow{color:var(--color-text-tertiary);font-size:14px;}

.error-msg{font-size:11px;color:#a32d2d;background:#fcebeb;border:0.5px solid #f09595;border-radius:var(--border-radius-md);padding:8px 10px;margin-bottom:12px;display:none;}
.error-msg.show{display:block;}
.success-msg{font-size:11px;color:#085041;background:#e1f5ee;border:0.5px solid #5dcaa5;border-radius:var(--border-radius-md);padding:8px 10px;margin-bottom:12px;display:none;}
.success-msg.show{display:block;}

.back-btn{display:flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-size:12px;color:var(--color-text-secondary);font-family:inherit;margin-bottom:16px;padding:0;}
.back-btn:hover{color:var(--color-text-primary);}

.section-title{font-size:14px;font-weight:700;color:var(--color-text-primary);margin-bottom:4px;}
.section-sub{font-size:11px;color:var(--color-text-secondary);margin-bottom:18px;line-height:1.5;}

.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.radio-group{display:flex;gap:6px;flex-wrap:wrap;}
.radio-btn{padding:6px 12px;border:1px solid var(--color-border-secondary);border-radius:20px;font-size:11px;font-weight:500;cursor:pointer;background:var(--color-background-primary);color:var(--color-text-secondary);font-family:inherit;transition:all .15s;}
.radio-btn.on{background:#eeedfe;color:#3c3489;border-color:#7b72e9;font-weight:700;}

.id-preview{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;margin-top:14px;margin-bottom:4px;}
.id-preview-label{font-size:10px;color:var(--color-text-tertiary);margin-bottom:4px;}
.id-preview-val{font-size:13px;font-weight:700;color:#3c3489;font-family:monospace;}

.tab-bar{display:flex;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:0;}
.tab-item{flex:1;padding:10px 4px;font-size:11px;font-weight:500;text-align:center;cursor:pointer;color:var(--color-text-secondary);border-bottom:2px solid transparent;transition:all .15s;}
.tab-item.on{color:#7b72e9;border-bottom-color:#7b72e9;font-weight:700;}

.step-badge{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#7b72e9;color:#fff;font-size:10px;font-weight:700;margin-right:5px;}
</style>

<div class="phone">
  <div class="screen">

    <div class="tab-bar">
      <div class="tab-item on" id="tab-login" onclick="switchTab('login')">로그인</div>
      <div class="tab-item" id="tab-create" onclick="switchTab('create')">사용자 생성</div>
    </div>

    <!-- 로그인 화면 -->
    <div class="login-view" id="view-login">
      <div class="logo-area">
        <div class="logo-icon">💪</div>
        <div class="logo-title">헬스 대시보드</div>
        <div class="logo-sub">건강 기록 · 식단 · 운동 관리</div>
      </div>

      <div class="error-msg" id="login-error">ID 또는 비밀번호가 올바르지 않아요.</div>

      <div class="form-group">
        <label class="form-label">사용자 ID</label>
        <input class="form-input" id="login-id" type="text" placeholder="전달받은 ID를 입력하세요" autocomplete="off" spellcheck="false">
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <div class="pw-wrap">
          <input class="form-input" id="login-pw" type="password" placeholder="비밀번호를 입력하세요">
          <button class="pw-toggle" onclick="togglePw('login-pw', this)" aria-label="비밀번호 표시">
            <i class="ti ti-eye"></i>
          </button>
        </div>
      </div>

      <button class="btn-primary" onclick="doLogin()">로그인</button>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">또는 프로필 선택</div>
        <div class="divider-line"></div>
      </div>

      <div class="profile-list" id="profile-list">
        <div class="profile-card" onclick="selectProfile('bang')">
          <div class="profile-avatar" style="background:#eeedfe;">💪</div>
          <div class="profile-info">
            <div class="profile-name">방수현</div>
            <div class="profile-id">@bang</div>
          </div>
          <div class="profile-arrow"><i class="ti ti-chevron-right"></i></div>
        </div>
      </div>

      <div style="text-align:center;font-size:11px;color:var(--color-text-tertiary);margin-top:4px;">
        ID는 관리자에게 전달받으세요
      </div>
    </div>

    <!-- 사용자 생성 화면 (쓰기 권한 PC 전용) -->
    <div class="create-view" id="view-create">
      <div class="section-title">새 사용자 생성</div>
      <div class="section-sub">쓰기 권한이 있는 PC에서만 가능해요.<br>생성 후 ID를 사용자에게 전달하세요.</div>

      <div class="success-msg" id="create-success">사용자가 생성됐어요! 아래 ID를 전달해주세요.</div>
      <div class="error-msg" id="create-error">쓰기 권한이 없어요. 비밀번호를 먼저 입력해주세요.</div>

      <div class="form-group">
        <label class="form-label"><span class="step-badge">1</span>이름</label>
        <input class="form-input" id="new-name" type="text" placeholder="홍길동">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label"><span class="step-badge">2</span>나이</label>
          <input class="form-input" id="new-age" type="number" placeholder="20">
        </div>
        <div class="form-group">
          <label class="form-label">성별</label>
          <div class="radio-group" style="margin-top:5px;">
            <button class="radio-btn on" id="g-m" onclick="selectGender('남')">남</button>
            <button class="radio-btn" id="g-f" onclick="selectGender('여')">여</button>
          </div>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">키 (cm)</label>
          <input class="form-input" id="new-height" type="number" placeholder="140~200">
        </div>
        <div class="form-group">
          <label class="form-label">체중 (kg)</label>
          <input class="form-input" id="new-weight" type="number" placeholder="40.0~120.0">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label"><span class="step-badge">3</span>목표</label>
        <div class="radio-group">
          <button class="radio-btn on" onclick="selectGoal(this)">벌크업</button>
          <button class="radio-btn" onclick="selectGoal(this)">다이어트</button>
          <button class="radio-btn" onclick="selectGoal(this)">유지</button>
          <button class="radio-btn" onclick="selectGoal(this)">재활</button>
        </div>
      </div>

      <div class="form-group" style="margin-top:14px;">
        <label class="form-label"><span class="step-badge">4</span>초기 비밀번호 설정</label>
        <div class="pw-wrap">
          <input class="form-input" id="new-pw" type="password" placeholder="사용자에게 알려줄 비밀번호">
          <button class="pw-toggle" onclick="togglePw('new-pw', this)" aria-label="비밀번호 표시">
            <i class="ti ti-eye"></i>
          </button>
        </div>
      </div>

      <div class="id-preview">
        <div class="id-preview-label">자동 생성 ID (사용자에게 전달)</div>
        <div class="id-preview-val" id="id-preview-val">이름 입력 시 생성됩니다</div>
      </div>

      <button class="btn-primary" style="margin-top:10px;" onclick="doCreate()">사용자 생성 및 저장</button>
    </div>

  </div>
</div>

<script>
var selGender='남', selGoal='벌크업';

function switchTab(t){
  document.getElementById('tab-login').className='tab-item'+(t==='login'?' on':'');
  document.getElementById('tab-create').className='tab-item'+(t==='create'?' on':'');
  document.getElementById('view-login').className='login-view'+(t==='login'?'':' hidden');
  document.getElementById('view-create').style.display=t==='create'?'block':'none';
}

function togglePw(id, btn){
  var el=document.getElementById(id);
  var isText=el.type==='text';
  el.type=isText?'password':'text';
  btn.innerHTML=isText?'<i class="ti ti-eye"></i>':'<i class="ti ti-eye-off"></i>';
}

function selectGender(g){
  selGender=g;
  document.getElementById('g-m').className='radio-btn'+(g==='남'?' on':'');
  document.getElementById('g-f').className='radio-btn'+(g==='여'?' on':'');
}

function selectGoal(btn){
  document.querySelectorAll('#view-create .radio-group:last-of-type .radio-btn')
    .forEach(function(b){b.className='radio-btn';});
  btn.className='radio-btn on';
  selGoal=btn.textContent;
}

function genId(name){
  if(!name)return'';
  var map={'방':'bang','홍':'hong','김':'kim','이':'lee','박':'park','최':'choi','정':'jung','강':'kang','조':'cho','윤':'yoon'};
  var first=name.charAt(0);
  var base=map[first]||(encodeURIComponent(first).replace(/%/g,'').toLowerCase().substring(0,4));
  return base+'_'+Math.random().toString(36).substring(2,6);
}

document.getElementById('new-name').addEventListener('input', function(){
  var id=genId(this.value.trim());
  document.getElementById('id-preview-val').textContent=id||'이름 입력 시 생성됩니다';
});

function selectProfile(id){
  document.getElementById('login-id').value=id;
  document.getElementById('login-pw').focus();
}

function doLogin(){
  var id=document.getElementById('login-id').value.trim();
  var pw=document.getElementById('login-pw').value;
  var err=document.getElementById('login-error');
  if(!id||!pw){err.className='error-msg show';err.textContent='ID와 비밀번호를 모두 입력해주세요.';return;}
  err.className='error-msg show';
  err.textContent='(데모) 실제 구현 시 users.json과 SHA-256 비교 후 대시보드 진입';
}

function doCreate(){
  var name=document.getElementById('new-name').value.trim();
  var pw=document.getElementById('new-pw').value;
  var err=document.getElementById('create-error');
  var suc=document.getElementById('create-success');
  if(!name||!pw){err.className='error-msg show';return;}
  var id=genId(name);
  suc.className='success-msg show';
  suc.textContent='사용자 생성 완료! 전달할 ID: '+id;
  err.className='error-msg';
}
</script>
