<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>재무 관리 — 방수현</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f5f7;
  --surface:#fff;
  --surface-2:#f0f0f5;
  --border:#e5e5ea;
  --text:#1a1a1a;
  --text-2:#6e6e73;
  --text-3:#aeaeb2;
  --accent:#7b72e9;
  --accent-bg:#f3f0ff;
  --accent-border:#d4c8ff;
  --green:#1d9e75;
  --green-bg:#e6fdf2;
  --green-border:#a3e9cc;
  --orange:#d4720a;
  --orange-bg:#fff7e6;
  --orange-border:#fdd8a0;
  --red:#e02020;
  --red-bg:#fdecea;
  --red-border:#f5b8b8;
  --blue:#185fa5;
  --blue-bg:#dceefb;
  --blue-border:#9ecef5;
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
}
body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 16px 60px;max-width:640px;margin:0 auto;}

/* 헤더 */
.page-header{margin-bottom:20px;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.page-sub{font-size:12px;color:var(--text-2);}

/* 네비 */
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.nav-btn{padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;border-radius:99px;border:1.5px solid var(--border);color:var(--text-2);background:var(--surface);transition:all .15s;font-family:inherit;white-space:nowrap;}
.nav-btn.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border);}
.nav-btn:hover:not(.on){border-color:var(--accent);color:var(--accent);}

/* 섹션 */
.section{display:none;}
.section.on{display:block;}

/* 카드 */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;}
.ch{font-weight:700;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text);}
.ch i{color:var(--accent);}

/* 배지 */
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;}
.bg{background:var(--green-bg);color:var(--green);}
.ba{background:var(--orange-bg);color:var(--orange);}
.bi{background:var(--blue-bg);color:var(--blue);}
.br{background:var(--red-bg);color:var(--red);}
.bp{background:var(--accent-bg);color:var(--accent);}

/* 행 */
.row{display:flex;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--border);gap:12px;font-size:13px;}
.row:last-child{border-bottom:none;padding-bottom:0;}
.rl{color:var(--text-2);flex-shrink:0;line-height:1.5;min-width:100px;}
.rv{text-align:right;font-weight:600;line-height:1.5;}
.rv small{font-weight:400;font-size:11px;color:var(--text-2);display:block;margin-top:1px;}

/* 알림 박스 */
.ok{background:var(--green-bg);border-left:3px solid var(--green);padding:10px 14px;font-size:12px;color:var(--green);line-height:1.6;margin:8px 0;border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
.tip{background:var(--orange-bg);border-left:3px solid var(--orange);padding:10px 14px;font-size:12px;color:var(--orange);line-height:1.6;margin:8px 0;border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
.info{background:var(--blue-bg);border-left:3px solid var(--blue);padding:10px 14px;font-size:12px;color:var(--blue);line-height:1.6;margin:8px 0;border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
.warn{background:var(--red-bg);border-left:3px solid var(--red);padding:10px 14px;font-size:12px;color:var(--red);line-height:1.6;margin:8px 0;border-radius:0 var(--radius-sm) var(--radius-sm) 0;}

/* 스텝 리스트 */
.step-list{list-style:none;}
.step-list li{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.55;}
.step-list li:last-child{border-bottom:none;}
.snum{min-width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px;background:var(--accent-bg);color:var(--accent);}
.snum.red{background:var(--red-bg);color:var(--red);}
.snum.green{background:var(--green-bg);color:var(--green);}

/* 그리드 */
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px;}
.mc{background:var(--surface-2);border-radius:var(--radius-md);padding:12px;}
.mc .ml{font-size:11px;color:var(--text-2);margin-bottom:4px;}
.mc .mv{font-size:18px;font-weight:800;color:var(--text);}
.mc .ms{font-size:11px;color:var(--text-3);margin-top:2px;}

/* 시뮬레이터 */
.sim{background:var(--surface-2);border-radius:var(--radius-md);padding:14px;margin-top:8px;}
.sim-r{display:flex;justify-content:space-between;font-size:13px;padding:3px 0;color:var(--text-2);}
.sim-r span:last-child{color:var(--green);font-weight:600;}
.sim-t{display:flex;justify-content:space-between;font-size:15px;font-weight:800;padding-top:10px;border-top:1.5px solid var(--border);margin-top:8px;}

/* 섹션 타이틀 */
.tl{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;margin:20px 0 10px;padding-left:2px;}
.tl:first-child{margin-top:0;}

/* 개념 박스 */
.concept-box{border:1.5px solid var(--border);border-radius:var(--radius-md);padding:12px;margin-bottom:10px;background:var(--surface);}
.cb-title{font-size:13px;font-weight:700;margin-bottom:5px;display:flex;align-items:center;gap:6px;color:var(--text);}
.cb-body{font-size:12px;color:var(--text-2);line-height:1.65;}

/* 진행바 */
.prog-wrap{margin:8px 0;}
.prog-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-2);margin-bottom:4px;}
.prog-bar{height:6px;background:var(--border);border-radius:4px;overflow:hidden;}
.prog-fill{height:100%;border-radius:4px;transition:width .5s ease;}

/* 태그 */
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.pill{font-size:11px;padding:3px 10px;border-radius:99px;border:1.5px solid var(--border);color:var(--text-2);}

/* 링크 목록 */
.link-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.link-item:last-child{border-bottom:none;}
.link-icon{width:32px;height:32px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;}
.link-body{flex:1;min-width:0;}
.link-title{font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.link-url{font-size:11px;color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.link-arrow{color:var(--text-3);flex-shrink:0;}
</style>
</head>
<body>

function render(){
  const nav=document.getElementById('nav');
  const secs=document.getElementById('sections');
  pages.forEach((p,i)=>{
    const btn=document.createElement('button');
    btn.className='nav-btn'+(i===0?' on':'');
    btn.innerHTML=`<i class="ti ${p.icon}" aria-hidden="true" style="font-size:13px;margin-right:4px;vertical-align:middle"></i>${p.label}`;
    btn.onclick=()=>{
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
      document.querySelectorAll('.section').forEach(s=>s.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById('sec-'+p.id).classList.add('on');
    };
    nav.appendChild(btn);
    const sec=document.createElement('div');
    sec.id='sec-'+p.id;
    sec.className='section'+(i===0?' on':'');
    sec.innerHTML=content[p.id];
    secs.appendChild(sec);
  });
}
render();
</script>
