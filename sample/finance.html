<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>재무 관리 — 방수현</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
:root {
  --color-text-primary: #1a1a1a;
  --color-text-secondary: #6b7280;
  --color-text-success: #166534;
  --color-text-warning: #92400e;
  --color-text-info: #1e40af;
  --color-text-danger: #991b1b;
  --color-background-primary: #ffffff;
  --color-background-secondary: #f9fafb;
  --color-background-success: #f0fdf4;
  --color-background-warning: #fffbeb;
  --color-background-info: #eff6ff;
  --color-background-danger: #fef2f2;
  --color-border-primary: #e5e7eb;
  --color-border-secondary: #d1d5db;
  --color-border-tertiary: #e5e7eb;
  --color-border-success: #86efac;
  --color-border-warning: #fcd34d;
  --color-border-info: #93c5fd;
  --color-border-danger: #fca5a5;
  --border-radius-md: 8px;
  --border-radius-lg: 12px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f3f4f6; padding: 1rem; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
.page { padding: 1rem 0; font-size: 15px; color: var(--color-text-primary); max-width: 720px; margin: 0 auto; }
.nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.5rem; }
.nav-btn { padding: 7px 14px; font-size: 13px; font-weight: 500; cursor: pointer; border-radius: 99px; border: 0.5px solid var(--color-border-secondary); color: var(--color-text-secondary); background: transparent; transition: all 0.15s; }
.nav-btn.on { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
.section { display: none; }
.section.on { display: block; }
.card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
.ch { font-weight: 500; font-size: 15px; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
.badge { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: var(--border-radius-md); }
.bg { background: var(--color-background-success); color: var(--color-text-success); }
.ba { background: var(--color-background-warning); color: var(--color-text-warning); }
.bi { background: var(--color-background-info); color: var(--color-text-info); }
.br { background: var(--color-background-danger); color: var(--color-text-danger); }
.row { display: flex; justify-content: space-between; align-items: flex-start; padding: 9px 0; border-bottom: 0.5px solid var(--color-border-tertiary); gap: 16px; font-size: 14px; }
.row:last-child { border-bottom: none; padding-bottom: 0; }
.rl { color: var(--color-text-secondary); flex-shrink: 0; line-height: 1.5; min-width: 90px; }
.rv { text-align: right; font-weight: 500; line-height: 1.5; }
.rv small { font-weight: 400; font-size: 12px; color: var(--color-text-secondary); display: block; }
.ok { background: var(--color-background-success); border-left: 3px solid var(--color-border-success); padding: 10px 14px; font-size: 13px; color: var(--color-text-success); line-height: 1.6; margin: 8px 0; border-radius: 0; }
.tip { background: var(--color-background-warning); border-left: 3px solid var(--color-border-warning); padding: 10px 14px; font-size: 13px; color: var(--color-text-warning); line-height: 1.6; margin: 8px 0; border-radius: 0; }
.info { background: var(--color-background-info); border-left: 3px solid var(--color-border-info); padding: 10px 14px; font-size: 13px; color: var(--color-text-info); line-height: 1.6; margin: 8px 0; border-radius: 0; }
.step-list { list-style: none; padding: 0; margin: 0; }
.step-list li { display: flex; gap: 12px; padding: 11px 0; border-bottom: 0.5px solid var(--color-border-tertiary); font-size: 14px; line-height: 1.55; }
.step-list li:last-child { border-bottom: none; }
.snum { min-width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; margin-top: 1px; background: var(--color-background-info); color: var(--color-text-info); }
.sim { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-top: 8px; }
.sim-r { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
.sim-t { display: flex; justify-content: space-between; font-size: 16px; font-weight: 500; padding-top: 10px; border-top: 0.5px solid var(--color-border-secondary); margin-top: 6px; }
.g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.mc { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 1rem; }
.mc .ml { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
.mc .mv { font-size: 20px; font-weight: 500; }
.mc .ms { font-size: 12px; color: var(--color-text-secondary); margin-top: 2px; }
.tl { font-size: 12px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin: 1.5rem 0 0.75rem; }
.concept-box { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1rem; margin-bottom: 10px; }
.cb-title { font-size: 14px; font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
.cb-body { font-size: 13px; color: var(--color-text-secondary); line-height: 1.6; }
.h-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 1.25rem; }
.h-tab { padding: 6px 13px; font-size: 12px; font-weight: 500; cursor: pointer; border-radius: 99px; border: 0.5px solid var(--color-border-secondary); color: var(--color-text-secondary); background: transparent; transition: all 0.15s; }
.h-tab.on { background: var(--color-background-info); color: var(--color-text-info); border-color: var(--color-border-info); }
.h-page { display: none; }
.h-page.on { display: block; }
.step-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.25rem; margin-bottom: 1rem; }
.step-row { display: flex; gap: 14px; padding: 14px 0; border-bottom: 0.5px solid var(--color-border-tertiary); }
.step-row:last-child { border-bottom: none; padding-bottom: 0; }
.step-num { min-width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex-shrink: 0; margin-top: 1px; background: var(--color-background-info); color: var(--color-text-info); }
.step-body strong { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
.step-body .desc { color: var(--color-text-secondary); font-size: 13px; line-height: 1.65; }
.screen { background: var(--color-background-secondary); border-radius: var(--border-radius-md); border: 0.5px solid var(--color-border-tertiary); padding: 10px 14px; margin-top: 8px; font-size: 13px; line-height: 1.7; color: var(--color-text-primary); }
.screen-label { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.screen-tap { display: inline-block; background: var(--color-background-info); color: var(--color-text-info); border-radius: var(--border-radius-md); padding: 3px 9px; font-size: 12px; font-weight: 500; margin: 2px 1px; }
.file-box { background: var(--color-background-danger); border-radius: var(--border-radius-md); padding: 10px 14px; font-size: 13px; color: var(--color-text-danger); margin-top: 8px; line-height: 1.6; }
.prep-item { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 0.5px solid var(--color-border-tertiary); font-size: 13px; }
.prep-item:last-child { border-bottom: none; }
.prep-dot { min-width: 6px; height: 6px; border-radius: 50%; background: var(--color-text-info); margin-top: 5px; flex-shrink: 0; }
.badge-wait { background: var(--color-background-warning); color: var(--color-text-warning); font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: var(--border-radius-md); display: inline-block; margin-left: 6px; }
.badge-go { background: var(--color-background-success); color: var(--color-text-success); font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: var(--border-radius-md); display: inline-block; margin-left: 6px; }
</style>
</head>
<body>
<div class="page">
<h2 class="sr-only">주택드림청약, 연금저축펀드, IRP, 파킹통장 완전 가이드 로드맵</h2>
<div class="nav" id="nav"></div>
<div id="sections"></div>

<script>
const pages = [

  { id: 'howto', label: '신청 방법', icon: 'ti-list-check' },
];

const content = {
  concept: `
    <div class="tl">4가지 상품을 한 줄로 이해하기</div>
    <div class="concept-box">
      <div class="cb-title"><i class="ti ti-home" aria-hidden="true" style="font-size:16px"></i> 주택드림 청약통장 — "내 집 마련 예약 통장"</div>
      <div class="cb-body">월 25만원씩 넣으면서 청약 당첨을 기다리는 통장. 넣을수록 당첨 확률이 올라가고, 이자도 4.5%로 높고, 세금도 돌려받습니다. 청약 당첨 시 최저 2.2% 초저금리 대출로 연결됩니다.</div>

    </div>
    <div class="concept-box">
      <div class="cb-title"><i class="ti ti-building-bank" aria-hidden="true" style="font-size:16px"></i> IRP — "직장인 전용 세금 환급 통장"</div>

    </div>
    <div class="concept-box">
      <div class="cb-title"><i class="ti ti-parking" aria-hidden="true" style="font-size:16px"></i> 파킹통장 — "고이자 자유입출금 통장"</div>
      <div class="cb-body">일반 통장(이자 0.1%)과 달리 하루만 맡겨도 연 2~3%대 이자를 주는 통장. 언제든 꺼낼 수 있어서 비상금과 월급 대기 자금을 보관하는 용도로 씁니다.</div>
    </div>
    <div class="ok">✅ 이 4개는 역할이 다 달라서 동시에 가입해도 겹치지 않습니다. 비상금(파킹) → 목돈 마련(청년미래적금) → 세금 환급(연금저축+IRP) → 내 집 마련(청약) 이 구조예요.</div>
  `,

  chung: `
    <div class="tl">기본 정보</div>
    <div class="card">
      <div class="ch"><i class="ti ti-home" aria-hidden="true"></i> 주택드림 청약통장이란?</div>
      <div class="row"><span class="rl">한마디</span><span class="rv">아파트 청약 신청권 + 4.5% 고금리 + 소득공제</span></div>

      <div class="row"><span class="rl">나이 조건</span><span class="rv">만 19~34세, 연 소득 5천만원 이하, 무주택</span></div>
    </div>

    <div class="tl">받을 수 있는 혜택 3가지</div>
    <div class="card">
      <div class="ch"><i class="ti ti-receipt-tax" aria-hidden="true"></i> 혜택 상세</div>
      <div style="margin-bottom:14px">
        <div style="font-size:13px;font-weight:500;margin-bottom:5px">① 연말정산 소득공제 — 연 약 19.8만원 절세</div>

    <div class="tl">신청 방법 (단계별)</div>
    <div class="card">
      <div class="ch"><i class="ti ti-list-check" aria-hidden="true"></i> 가입 절차</div>
      <ul class="step-list">
        <li><div class="snum">1</div><div><strong>홈택스에서 소득확인증명서 발급</strong><br><span style="color:var(--color-text-secondary)">홈택스(hometax.go.kr) 로그인 → 민원증명 → 즉시발급 → "소득확인증명서" 선택 시 용도를 반드시 "청년우대형 주택청약종합저축 가입 및 과세특례 신청용"으로 선택</span></div></li>

    <div class="sim">

    <div class="tl">기본 정보</div>
    <div class="card">
      <div class="ch"><i class="ti ti-chart-bar" aria-hidden="true"></i> 연금저축펀드란?</div>

    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (i === 0 ? ' on' : '');
    btn.innerHTML = `<i class="ti ${p.icon}" aria-hidden="true" style="font-size:14px;margin-right:4px"></i>${p.label}`;
    btn.onclick = () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('on'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById('sec-' + p.id).classList.add('on');
    };
    nav.appendChild(btn);
    const sec = document.createElement('div');
    sec.id = 'sec-' + p.id;
    sec.className = 'section' + (i === 0 ? ' on' : '');
    sec.innerHTML = content[p.id];
    secs.appendChild(sec);
  });
}
render();
</script>
</div>
</body>
</html>
