<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>클라이밍 입문 가이드 — 서울숲 구로점</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f0f0f;
  --surface:#1a1a1a;
  --surface-2:#222;
  --border:#2a2a2a;
  --text:#f0f0f0;
  --text-2:#999;
  --text-3:#555;
  --accent:#c8f542;
  --accent-dim:#8fb32e;
  --red:#ff4d4d;
  --orange:#ff9a3c;
  --blue:#4d9fff;
  --radius:12px;
}
body{
  font-family:'Noto Sans KR',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:20px 16px 80px;
  max-width:640px;
  margin:0 auto;
  line-height:1.6;
}

/* 헤더 */
.hero{
  padding:32px 0 24px;
  margin-bottom:24px;
  border-bottom:1px solid var(--border);
}
.hero-label{
  font-size:11px;
  font-weight:700;
  letter-spacing:2px;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:8px;
}
.hero-title{
  font-size:28px;
  font-weight:900;
  line-height:1.2;
  margin-bottom:8px;
  letter-spacing:-1px;
}
.hero-sub{
  font-size:13px;
  color:var(--text-2);
}

/* 네비 */
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:100;}
.nav-btn{padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;border-radius:99px;border:1px solid var(--border);color:var(--text-2);background:var(--surface);transition:all .15s;font-family:inherit;white-space:nowrap;}
.nav-btn.on{background:var(--accent);color:#000;border-color:var(--accent);}

/* 섹션 */
.section{display:none;}
.section.on{display:block;}

/* 카드 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;}
.card-title{font-size:13px;font-weight:700;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.card-title span{font-size:18px;}

/* 섹션 타이틀 */
.stl{font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--text-3);text-transform:uppercase;margin:20px 0 10px;padding-left:2px;}
.stl:first-child{margin-top:0;}

/* 아이템 */
.item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.6;}
.item:last-child{border-bottom:none;padding-bottom:0;}
.item-num{min-width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex-shrink:0;margin-top:2px;}
.num-green{background:var(--accent);color:#000;}
.num-red{background:var(--red);color:#fff;}
.num-orange{background:var(--orange);color:#000;}
.num-blue{background:var(--blue);color:#fff;}
.item-body b{color:var(--text);display:block;margin-bottom:2px;}
.item-body span{color:var(--text-2);font-size:12px;}

/* 경고 박스 */
.warn{background:#1a0f0f;border-left:3px solid var(--red);padding:10px 14px;font-size:12px;color:#ff8080;line-height:1.7;margin:8px 0;border-radius:0 8px 8px 0;}
.tip{background:#0f1a0a;border-left:3px solid var(--accent);padding:10px 14px;font-size:12px;color:var(--accent-dim);line-height:1.7;margin:8px 0;border-radius:0 8px 8px 0;}
.info{background:#0a0f1a;border-left:3px solid var(--blue);padding:10px 14px;font-size:12px;color:#80b3ff;line-height:1.7;margin:8px 0;border-radius:0 8px 8px 0;}

/* 그레이드 표 */
.grade-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.grade-row:last-child{border-bottom:none;}
.grade-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.grade-name{font-weight:700;min-width:60px;}
.grade-desc{font-size:12px;color:var(--text-2);flex:1;}
.grade-me{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent);color:#000;flex-shrink:0;}

/* 체크리스트 */
.check-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer;}
.check-item:last-child{border-bottom:none;}
.check-box{width:20px;height:20px;border:1.5px solid var(--border);border-radius:5px;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.check-item.done .check-box{background:var(--accent);border-color:var(--accent);}
.check-item.done .check-text{color:var(--text-3);text-decoration:line-through;}
.check-tick{display:none;color:#000;font-size:12px;font-weight:900;}
.check-item.done .check-tick{display:block;}

/* 동작 설명 */
.move-card{background:var(--surface-2);border-radius:10px;padding:14px;margin-bottom:8px;border:1px solid var(--border);}
.move-title{font-size:13px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
.move-title .badge{font-size:9px;padding:2px 7px;border-radius:99px;font-weight:700;}
.move-desc{font-size:12px;color:var(--text-2);line-height:1.7;}
.move-tip{font-size:11px;color:var(--accent-dim);margin-top:6px;}

/* 풀 그립 */
.grip-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
.grip-item{background:var(--surface-2);border-radius:10px;padding:12px;border:1px solid var(--border);}
.grip-name{font-size:12px;font-weight:700;margin-bottom:3px;}
.grip-desc{font-size:11px;color:var(--text-2);line-height:1.6;}
</style>
</head>
<body>

<div class="hero">
  <div class="hero-label">🧗 Climbing Guide</div>
  <div class="hero-title">클라이밍<br>입문 가이드</div>
  <div class="hero-sub">서울숲 구로점 · 초보자 2명을 위한 강습 자료</div>

<div class="nav" id="nav"></div>
<div id="sections"></div>

function render(){
  const nav=document.getElementById('nav');
  const secs=document.getElementById('sections');
  pages.forEach((p,i)=>{
    const btn=document.createElement('button');
    btn.className='nav-btn'+(i===0?' on':'');
    btn.textContent=p.label;
    btn.onclick=()=>{
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
      document.querySelectorAll('.section').forEach(s=>s.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById('sec-'+p.id).classList.add('on');
      window.scrollTo({top:0,behavior:'smooth'});
    };
    nav.appendChild(btn);
    const sec=document.createElement('div');
    sec.id='sec-'+p.id;
    sec.className='section'+(i===0?' on':'');
    sec.innerHTML=content[p.id];
    secs.appendChild(sec);
  });
}
render();
</script>
