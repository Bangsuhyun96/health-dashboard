<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>설정집 리더</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f5f7;
  --surface:#fff;
  --border:#e5e5ea;
  --text:#1a1a1a;
  --text-2:#6e6e73;
  --text-3:#aeaeb2;
  --accent:#3a3a5c;
  --accent-light:#f0f0f8;
  --red:#c0392b;
  --radius:12px;
}
body{
  font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:20px 16px 80px;
  max-width:640px;
  margin:0 auto;
  line-height:1.6;
}

/* 헤더 */
.hero{padding:28px 0 20px;margin-bottom:20px;border-bottom:1px solid var(--border);}
.hero-tag{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--red);text-transform:uppercase;margin-bottom:6px;}
.hero-title{font-size:22px;font-weight:900;line-height:1.3;letter-spacing:-0.5px;margin-bottom:6px;}
.hero-meta{font-size:12px;color:var(--text-2);}

/* 네비 */
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:100;border-bottom:1px solid var(--border);}
.nav-btn{padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;border-radius:99px;border:1.5px solid var(--border);color:var(--text-2);background:var(--surface);font-family:inherit;white-space:nowrap;transition:all .15s;}
.nav-btn.on{background:var(--accent);color:#fff;border-color:var(--accent);}

/* 섹션 */
.section{display:none;}
.section.on{display:block;}

/* 카드 */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:10px;}
.card-title{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:12px;letter-spacing:0.5px;text-transform:uppercase;}

/* 텍스트 입력 */
.paste-wrap{margin-bottom:16px;}
.paste-label{font-size:11px;color:var(--text-2);margin-bottom:6px;display:block;}
.paste-area{width:100%;min-height:100px;font-family:inherit;font-size:13px;padding:10px 12px;border:1.5px solid var(--border);border-radius:var(--radius);background:var(--surface);color:var(--text);outline:none;resize:vertical;line-height:1.6;transition:border-color .15s;}
.paste-area:focus{border-color:var(--accent);}
.paste-btn{width:100%;padding:10px;font-family:inherit;font-size:13px;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);cursor:pointer;margin-top:8px;}
.paste-btn:active{opacity:0.85;}

/* 항목 */
.item{padding:12px 0;border-bottom:1px solid var(--border);font-size:13px;line-height:1.7;}
.item:last-child{border-bottom:none;padding-bottom:0;}
.item-date{font-size:10px;color:var(--text-3);margin-bottom:4px;}
.item-text{white-space:pre-wrap;word-break:break-word;}

/* 인물 카드 */
.char-card{background:var(--accent-light);border:1.5px solid #d0d0e8;border-radius:var(--radius);padding:14px;margin-bottom:8px;}
.char-name{font-size:14px;font-weight:800;margin-bottom:4px;}
.char-desc{font-size:12px;color:var(--text-2);line-height:1.6;}
.char-tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent);color:#fff;margin-bottom:8px;}

/* 명대사 */
.quote{background:#1a1a2e;border-radius:var(--radius);padding:16px;margin-bottom:8px;}
.quote-who{font-size:10px;font-weight:700;color:#9090c0;margin-bottom:6px;letter-spacing:1px;}
.quote-text{font-size:13px;color:#e8e8f0;line-height:1.8;white-space:pre-wrap;}

/* 능력 표 */
.ability-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;}
.ability-row:last-child{border-bottom:none;}
.ability-key{min-width:80px;font-weight:700;color:var(--accent);font-size:11px;flex-shrink:0;}
.ability-val{color:var(--text);line-height:1.6;}

/* 반전 카드 */
.twist{border-left:3px solid var(--red);padding:10px 14px;margin-bottom:8px;background:#fff8f8;border-radius:0 8px 8px 0;font-size:13px;line-height:1.7;}
.twist-title{font-size:11px;font-weight:700;color:var(--red);margin-bottom:4px;}

/* 빈 상태 */
.empty{text-align:center;color:var(--text-3);padding:30px 0;font-size:13px;}
</style>
</head>
<body>

/* ── 메모 섹션 (localStorage 저장) ── */
function getNotes(){try{return JSON.parse(localStorage.getItem('novel_notes')||'[]');}catch{return[];}}
function saveNotes(arr){localStorage.setItem('novel_notes',JSON.stringify(arr));}

function renderNotes(){
  const arr=getNotes();
  const list=document.getElementById('notes-list');
  if(!arr.length){list.innerHTML='<div class="empty">메모가 없습니다.<br>아래에 텍스트를 붙여넣어 추가하세요.</div>';return;}
  list.innerHTML=arr.map((n,i)=>`
    <div class="item">
      <div class="item-date">${n.date}</div>
      <div class="item-text">${escHtml(n.text)}</div>
    </div>`).join('');
}

function addNote(){
  const ta=document.getElementById('note-input');
  const text=ta.value.trim();
  if(!text)return;
  const arr=getNotes();
  arr.unshift({text,date:new Date().toLocaleString('ko-KR')});
  saveNotes(arr);
  ta.value='';
  renderNotes();
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── 렌더 ── */
function render(){
  const nav=document.getElementById('nav');
  const secs=document.getElementById('sections');

  PAGES.forEach((p,i)=>{
    const btn=document.createElement('button');
    btn.className='nav-btn'+(i===0?' on':'');
    btn.textContent=p.label;
    btn.onclick=()=>{
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
      document.querySelectorAll('.section').forEach(s=>s.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById('sec-'+p.id).classList.add('on');
      window.scrollTo({top:0,behavior:'smooth'});
    };
    nav.appendChild(btn);

    const sec=document.createElement('div');
    sec.id='sec-'+p.id;
    sec.className='section'+(i===0?' on':'');

    if(p.id==='notes'){
      sec.innerHTML=`
        <div class="paste-wrap">
          <span class="paste-label">텍스트를 붙여넣으면 메모로 저장됩니다</span>
          <textarea class="paste-area" id="note-input" placeholder="설정, 아이디어, 수정사항 등 자유롭게 붙여넣기..."></textarea>
          <button class="paste-btn" onclick="addNote()">메모 추가</button>
        </div>
        <div class="card">
          <div class="card-title">저장된 메모</div>
          <div id="notes-list"></div>
        </div>`;
    }else{
      sec.innerHTML=CONTENT[p.id]||'';
    }
    secs.appendChild(sec);
  });

  renderNotes();
}

render();
</script>
</body>
</html>
