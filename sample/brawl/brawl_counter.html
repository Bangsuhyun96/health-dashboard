<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f5f7;--surface:#fff;--surface-2:#f0f0f5;
  --border:#e5e5ea;--text:#1a1a1a;--text-2:#6e6e73;--text-3:#aeaeb2;
  --accent:#7b72e9;--accent-bg:#f3f0ff;--accent-border:#d4c8ff;
  --green:#1d9e75;--green-bg:#e6fdf2;
  --red:#e02020;--red-bg:#fdecea;
  --orange:#d4720a;--orange-bg:#fff7e6;
  --blue:#185fa5;--blue-bg:#dceefb;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
}
body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh;padding:16px 16px 60px;max-width:640px;margin:0 auto;}

/* 헤더 */
.page-header{margin-bottom:16px;}
.page-title{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:3px;}
.page-sub{font-size:11px;color:var(--text-2);}

/* 검색 */
.search-wrap{position:sticky;top:0;z-index:100;background:var(--bg);padding:8px 0 10px;}
.search-box{width:100%;font-family:inherit;font-size:14px;padding:10px 14px 10px 36px;border:1.5px solid var(--border);border-radius:var(--radius-md);background:var(--surface);outline:none;transition:border-color .15s;}
.search-box:focus{border-color:var(--accent);}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);font-size:15px;}
.search-wrap-inner{position:relative;}

/* 필터 탭 */
.filter-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.filter-btn{padding:5px 12px;font-size:11px;font-weight:600;cursor:pointer;border-radius:99px;border:1.5px solid var(--border);color:var(--text-2);background:var(--surface);transition:all .15s;font-family:inherit;white-space:nowrap;}
.filter-btn.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border);}

/* 카운터 카드 */
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:14px;margin-bottom:8px;transition:border-color .15s;}
.card:hover{border-color:var(--accent-border);}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;cursor:pointer;}
.brawler-name{font-size:14px;font-weight:800;color:var(--text);}
.role-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;}
.counter-list{display:flex;flex-wrap:wrap;gap:5px;}
.counter-chip{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--red-bg);color:var(--red);border:1.5px solid #f5b8b8;cursor:pointer;transition:all .15s;}
.counter-chip:hover{background:var(--red);color:#fff;}
.counter-chip.special{background:var(--orange-bg);color:var(--orange);border-color:#fdd8a0;}
.count-badge{font-size:10px;color:var(--text-3);margin-top:6px;}

/* 없음 */
.empty{text-align:center;color:var(--text-3);padding:40px 0;font-size:13px;}

/* 역할별 색상 */
.role-탱커{background:#dceefb;color:#185fa5;}
.role-전사{background:#e6fdf2;color:#1d9e75;}
.role-저격수{background:#f3f0ff;color:#7b72e9;}
.role-투척수{background:#fff7e6;color:#d4720a;}
.role-암살자{background:#fdecea;color:#e02020;}
.role-서포터{background:#f0f4ff;color:#185fa5;}
.role-컨트롤러{background:#e6fdf2;color:#0a5c46;}
.role-피해딜러{background:#fff3e0;color:#e65100;}
.role-기타{background:var(--surface-2);color:var(--text-2);}

/* 역할 필터 색상 */
.filter-btn[data-role="탱커"].on{background:#dceefb;color:#185fa5;border-color:#9ecef5;}
.filter-btn[data-role="전사"].on{background:#e6fdf2;color:#1d9e75;border-color:#a3e9cc;}
.filter-btn[data-role="저격수"].on{background:#f3f0ff;color:#7b72e9;border-color:#d4c8ff;}
.filter-btn[data-role="투척수"].on{background:#fff7e6;color:#d4720a;border-color:#fdd8a0;}
.filter-btn[data-role="암살자"].on{background:#fdecea;color:#e02020;border-color:#f5b8b8;}
.filter-btn[data-role="서포터"].on{background:#f0f4ff;color:#185fa5;border-color:#b0bfee;}
.filter-btn[data-role="컨트롤러"].on{background:#e6fdf2;color:#0a5c46;border-color:#a3e9cc;}

/* 강조 */
mark{background:var(--accent-bg);color:var(--accent);border-radius:3px;padding:0 2px;}

  {name:'샌디',role:'서포터',counters:['니타','드라코','엠즈','켄지','발리','주주']},
  {name:'앰버',role:'피해딜러',counters:['바이런','크로우','모티스','롤라']},
  {name:'메그',role:'탱커',counters:['롤라','비','콜레트','찰리']},
  {name:'서지',role:'피해딜러',counters:['찰리','러프스','발리','주주','타라']},
  {name:'체스터',role:'피해딜러',counters:['찰리','스튜','타라','러프스','루미','미나','엠즈','벽깔사람이 없는경우 모든 스로어']},
  {name:'코델리우스',role:'탱커',counters:['프랭크','스튜','샌디','서지','게일']},
  {name:'키트',role:'서포터',counters:['프랭크','릴리','코델리우스','행크','더그','재키']},
  {name:'드라코',role:'탱커',counters:['프랭크','코델리우스','크로우','애쉬','루']},
  {name:'켄지',role:'전사',counters:['드라코','프랭크','코델리우스','핑크스','애쉬']},
  {name:'피어스',role:'피해딜러',counters:['스파이크','찰리','파이퍼','러프스','나니']},
  {name:'카제',role:'암살자',counters:['타라','체스터','크로우','켄지','샌디','핑크스']},
  {name:'시리우스',role:'피해딜러',counters:['발리','주주 등 모든 스로어','에드거','모티스','페니','루미']},
  {name:'볼트',role:'기타',counters:['???']},
  {name:'스타노바',role:'기타',counters:['???']},
];

const ROLES=['전체','탱커','전사','저격수','투척수','암살자','서포터','컨트롤러','피해딜러','기타'];
let currentRole='전체';

// 필터 버튼 생성
const fr=document.getElementById('filter-row');
ROLES.forEach(r=>{
  const b=document.createElement('button');
  b.className='filter-btn'+(r==='전체'?' on':'');
  b.setAttribute('data-role',r);
  b.textContent=r;
  b.onclick=()=>{
    currentRole=r;
    document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    render();
  };
  fr.appendChild(b);
});

function highlight(text,q){
  if(!q)return text;
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return text.replace(re,'<mark>$1</mark>');
}

function render(){
  const q=document.getElementById('search').value.trim();
  const el=document.getElementById('list');
  let filtered=DATA;

  if(currentRole!=='전체') filtered=filtered.filter(d=>d.role===currentRole);
  if(q){
    filtered=filtered.filter(d=>
      d.name.includes(q)||d.counters.some(c=>c.includes(q))
    );
  }

  if(!filtered.length){
    el.innerHTML='<div class="empty">🔍 검색 결과가 없습니다</div>';
    return;
  }

  el.innerHTML=filtered.map(d=>{
    const chips=d.counters.map((c,i)=>`<span class="counter-chip${i===0?' special':''}" onclick="searchCounter('${c.replace(/[^가-힣a-zA-Z0-9&]/g,'').substring(0,4)}')">${q?highlight(c,q):c}</span>`).join('');
    return`<div class="card">
      <div class="card-head">
        <span class="brawler-name">${q?highlight(d.name,q):d.name}</span>
        <span class="role-badge role-${d.role}">${d.role}</span>
      </div>
      <div class="counter-list">${chips}</div>
      <div class="count-badge">카운터 ${d.counters.length}개 · 첫 번째가 가장 강한 카운터</div>
    </div>`;
  }).join('');
}

function searchCounter(name){
  document.getElementById('search').value=name;
  currentRole='전체';
  document.querySelectorAll('.filter-btn').forEach(x=>x.classList.remove('on'));
  document.querySelector('.filter-btn[data-role="전체"]').classList.add('on');
  render();
}

render();
</script>
