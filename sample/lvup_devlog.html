<head>

<title>LvUP 개발일지</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#f5f5f7;--surface:#fff;--surface-2:#f0f0f5;
  --border:#e5e5ea;--text:#1a1a1a;--text-2:#6e6e73;--text-3:#aeaeb2;
  --accent:#7b72e9;--accent-bg:#f3f0ff;--accent-border:#d4c8ff;
  --green:#1d9e75;--green-bg:#e6fdf2;--green-border:#a3e9cc;
  --orange:#d4720a;--orange-bg:#fff7e6;
  --red:#e02020;--red-bg:#fdecea;
  --blue:#185fa5;--blue-bg:#dceefb;
  --gold:#c9a000;--gold-bg:#fff8e1;
  --radius-sm:8px;--radius-md:12px;--radius-lg:16px;
}
body{font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;background:var(--bg);color:var(--text);min-height:100vh;padding:20px 16px 60px;}

.page-header{margin-bottom:20px;}
.page-title{font-size:22px;font-weight:800;letter-spacing:-.5px;margin-bottom:4px;}
.page-sub{font-size:12px;color:var(--text-2);}

.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px;}
.nav-btn{padding:7px 14px;font-size:12px;font-weight:600;cursor:pointer;border-radius:99px;border:1.5px solid var(--border);color:var(--text-2);background:var(--surface);transition:all .15s;font-family:inherit;white-space:nowrap;}
.nav-btn.on{background:var(--accent-bg);color:var(--accent);border-color:var(--accent-border);}
.nav-btn:hover:not(.on){border-color:var(--accent);color:var(--accent);}

.section{display:none;}
.section.on{display:block;}

.card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius-lg);padding:16px;margin-bottom:12px;}
.ch{font-weight:700;font-size:14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text);}
.ch i{color:var(--accent);}

.tl{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.8px;margin:20px 0 10px;padding-left:2px;}
.tl:first-child{margin-top:0;}

/* 통계 그리드 */
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px;}
.mc{background:var(--surface-2);border-radius:var(--radius-md);padding:12px;}
.mc .ml{font-size:11px;color:var(--text-2);margin-bottom:4px;}
.mc .mv{font-size:20px;font-weight:800;color:var(--text);}
.mc .ms{font-size:11px;color:var(--text-3);margin-top:2px;}

/* 배지 */
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px;flex-shrink:0;}
.done{background:var(--green-bg);color:var(--green);}
.pend{background:var(--orange-bg);color:var(--orange);}
.skip{background:var(--surface-2);color:var(--text-3);}

/* 로그 테이블 */
.log-table{width:100%;border-collapse:collapse;}
.log-table th{font-size:10px;font-weight:700;color:var(--text-3);text-align:left;padding:6px 8px;border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:.5px;}
.log-table td{font-size:12px;padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.5;}
.log-table tr:last-child td{border-bottom:none;}
.log-table .num{color:var(--text-3);font-size:11px;width:28px;}
.log-table .req{flex:1;}
.log-table .st{text-align:center;width:50px;}

/* 알림 */
.ok{background:var(--green-bg);border-left:3px solid var(--green);padding:10px 14px;font-size:12px;color:var(--green);line-height:1.6;margin:8px 0;border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
.info{background:var(--blue-bg);border-left:3px solid var(--blue);padding:10px 14px;font-size:12px;color:var(--blue);line-height:1.6;margin:8px 0;border-radius:0 var(--radius-sm) var(--radius-sm) 0;}
.warn{background:var(--orange-bg);border-left:3px solid var(--orange);padding:10px 14px;font-size:12px;color:var(--orange);line-height:1.6;margin:8px 0;border-radius:0 var(--radius-sm) var(--radius-sm) 0;}

/* 타임라인 (버그/보안) */
.tl-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px;line-height:1.5;}
.tl-item:last-child{border-bottom:none;}
.tl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:5px;}
.tl-green{background:var(--green);}
.tl-orange{background:var(--orange);}
.tl-red{background:var(--red);}

/* 스택 태그 */
.stack{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.tag{font-size:11px;padding:3px 10px;border-radius:99px;border:1.5px solid var(--border);color:var(--text-2);background:var(--surface);}
.tag.hl{border-color:var(--accent-border);color:var(--accent);background:var(--accent-bg);}
</style>

function render(){
  const nav=document.getElementById('nav');
  const secs=document.getElementById('sections');
  pages.forEach((p,i)=>{
    const btn=document.createElement('button');
    btn.className='nav-btn'+(i===0?' on':'');
    btn.innerHTML=`<i class="ti ${p.icon}" aria-hidden="true" style="font-size:13px;margin-right:4px;vertical-align:middle"></i>${p.label}`;
    btn.onclick=()=>{
      document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('on'));
      document.querySelectorAll('.section').forEach(s=>s.classList.remove('on'));
      btn.classList.add('on');
      document.getElementById('sec-'+p.id).classList.add('on');
    };
    nav.appendChild(btn);
    const sec=document.createElement('div');
    sec.id='sec-'+p.id;
    sec.className='section'+(i===0?' on':'');
    sec.innerHTML=content[p.id];
    secs.appendChild(sec);
  });
}
render();
</script>
